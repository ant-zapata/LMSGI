<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 300px;
            border-collapse: collapse;
        }
        thead {
            background-color: #ac2525;
        }
        th, td {
            border: 1px solid rgb(0, 0, 0);
            padding: 8px;
            text-align: center;
        }

       
    </style>
</head>
<body>
    <table>
        <caption>Tabla de ejemplo</caption>
        <thead>
        <tr>
            <th></th>
            <th scope="col">Header 1</th>
            <th scope="col">Header 2</th>
            <th scope="col">Header 3</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <th scope="row">Row 1</th>
            <td style="background-color: #35d0de;">Celda 1</td>
            <td>Celda 2</td>
            <td>Celda 3</td>
        </tr>
        <tr>
            <th scope="row">Row 2</th>
            <td rowspan="2">Celda 4-7</td>
            <td colspan="2" style="background-color: #35d0de">Celda 5-6</td>
            
        </tr>
        <tr>
            <th scope="row">Row 3</th>
            
            <td>Celda 8</td>
            <td>Celda 9</td>
        </tr>
    </tbody>
    <tfoot>
        <tr>
            <td colspan="4">Pie de tabla</td>
            
            
            
        </tr>   
    </tfoot>    
    </table>
</body>
</html>
